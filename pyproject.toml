[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bear-with-me"
version = "0.1.0"
description = "Privacy-preserving lost-property reunification MVP"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
calling = ["livekit-api>=1.0.0"]
test = ["httpx>=0.27.0", "pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]
